<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>HandyHub — Feed Refresh (3 כיוונים)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;500;600;700;800&family=Frank+Ruhl+Libre:wght@400;500;700;800;900&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    html, body { margin: 0; padding: 0; font-family: 'Assistant', system-ui, sans-serif; background: #ece1cc; color: #1a3a2e; }
    *, *::before, *::after { box-sizing: border-box; }

    /* Burst keyframes (used by LikeBtn dots) */
    @keyframes frBurst {
      0%   { transform: translate(0,0) scale(.6); opacity: 1; }
      100% { transform: translate(var(--bx), var(--by)) scale(0); opacity: 0; }
    }

    /* The design canvas root */
    #root { min-height: 100vh; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" data-presets="react" src="design-canvas.jsx"></script>
  <script type="text/babel" data-presets="react" src="feed-shared.jsx"></script>
  <script type="text/babel" data-presets="react" src="feed-v1-workbench.jsx"></script>
  <script type="text/babel" data-presets="react" src="feed-v2-shopfloor.jsx"></script>
  <script type="text/babel" data-presets="react" src="feed-v3-bulletin.jsx"></script>

  <script type="text/babel" data-presets="react">
    function App() {
      return (
        <DesignCanvas>
          <DCSection id="feed-refresh" title="HandyHub · Feed Refresh" subtitle="פלטה: סדנה / יער · 3 כיוונים להשוואה. גלגל / Ctrl+wheel = זום. ⤢ למלוא המסך.">
            <DCArtboard id="v1-workbench" label="V1 · Workbench / Editorial" width={760} height={3000}>
              <FeedV1/>
            </DCArtboard>
            <DCArtboard id="v2-shopfloor" label="V2 · Shop Floor / Ticket" width={760} height={3200}>
              <FeedV2/>
            </DCArtboard>
            <DCArtboard id="v3-bulletin" label="V3 · Bulletin / Compact" width={760} height={1500}>
              <FeedV3/>
            </DCArtboard>
          </DCSection>
        </DesignCanvas>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
  </script>
</body>
</html>
