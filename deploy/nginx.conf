# HandyHub on EC2: replaces /etc/nginx/nginx.conf.
# The built frontend (frontend/dist) is copied to /var/www/handyhub; /api and /uploads go to gunicorn on :5050.
user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log;
pid /run/nginx.pid;

events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    access_log    /var/log/nginx/access.log;
    sendfile      on;
    server_tokens off;
    types_hash_max_size 4096;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;

        root  /var/www/handyhub;
        index index.html;

        # Posts upload up to 6 images (Flask's MAX_CONTENT_LENGTH is 40MB; nginx's default is only 1MB)
        client_max_body_size 40m;

        # The React app (hash routing, so every page is index.html). Always re-check index.html after a deploy.
        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache";
        }

        # Vite puts a hash in every asset name, so they can be cached for good
        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        location /api/ {
            proxy_pass http://127.0.0.1:5050;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 90s;   # AI calls (writing assistant, toxicity check) can take a while
        }

        # Uploaded images live in backend/uploads; Flask serves them
        location /uploads/ {
            proxy_pass http://127.0.0.1:5050;
            proxy_set_header Host $host;
        }
    }
}
